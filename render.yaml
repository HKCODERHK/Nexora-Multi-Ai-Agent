# Render Blueprint for Nexora AI (free plans).
# Service names must be globally unique: if Render appends a suffix to a name,
# update the matching https://<name>.onrender.com URLs below.
services:
  # ---------- React (Vite) frontend ----------
  - type: web
    name: nexora-hk
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_SERVER_URL             # same domain as the site; /api/* is rewritten below
        value: https://nexora-hk.onrender.com
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_RAZORPAY_KEY_ID
        sync: false
      - key: VITE_WAKE_URLS              # browser pings wake the sleeping free services
        value: https://nexora-hk-gateway.onrender.com/,https://nexora-hk-auth.onrender.com/,https://nexora-hk-chat.onrender.com/,https://nexora-hk-agent.onrender.com/,https://nexora-hk-billing.onrender.com/
    routes:
      - type: rewrite
        source: /api/*
        destination: https://nexora-hk-gateway.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

  # ---------- Gateway ----------
  - type: web
    name: nexora-hk-gateway
    runtime: docker
    plan: free
    dockerfilePath: ./backend/gateway/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: FRONTEND_URL
        value: https://nexora-hk.onrender.com
      - key: AUTH_SERVICE
        value: https://nexora-hk-auth.onrender.com
      - key: CHAT_SERVICE
        value: https://nexora-hk-chat.onrender.com
      - key: AGENT_SERVICE
        value: https://nexora-hk-agent.onrender.com
      - key: BILLING_SERVICE
        value: https://nexora-hk-billing.onrender.com
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: nexora-hk-redis
          property: connectionString

  # ---------- Auth (needs serviceAccountKey.json as a Secret File) ----------
  - type: web
    name: nexora-hk-auth
    runtime: docker
    plan: free
    dockerfilePath: ./backend/services/auth/Dockerfile
    dockerContext: ./backend
    dockerCommand: sh -c "cp /etc/secrets/serviceAccountKey.json ./serviceAccountKey.json; npm start"
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: nexora-hk-redis
          property: connectionString

  # ---------- Chat ----------
  - type: web
    name: nexora-hk-chat
    runtime: docker
    plan: free
    dockerfilePath: ./backend/services/chat/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: MONGODB_URI
        sync: false

  # ---------- Agent (LLMs, RAG, file generation) ----------
  - type: web
    name: nexora-hk-agent
    runtime: docker
    plan: free
    dockerfilePath: ./backend/services/agent/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: CHAT_SERVICE
        value: https://nexora-hk-chat.onrender.com
      - key: AUTH_SERVICE
        value: https://nexora-hk-auth.onrender.com
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: nexora-hk-redis
          property: connectionString
      - key: MONGODB_URI
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_KEY
        sync: false
      - key: AWS_BUCKET_NAME
        sync: false
      - key: QDRANT_URL                  # include the port, e.g. https://xxxx.cloud.qdrant.io:6333
        sync: false
      - key: QDRANT_API_KEY
        sync: false

  # ---------- Billing (Razorpay, use TEST keys for a demo) ----------
  - type: web
    name: nexora-hk-billing
    runtime: docker
    plan: free
    dockerfilePath: ./backend/services/billing/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: AUTH_SERVICE
        value: https://nexora-hk-auth.onrender.com
      - key: MONGODB_URI
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

  # ---------- Redis (sessions, cache, rate limits) ----------
  - type: keyvalue
    name: nexora-hk-redis
    plan: free
    ipAllowList: []
